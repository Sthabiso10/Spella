name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Dependabot resolves pub packages without the Flutter SDK's constraints,
      # so it can pin transitive packages (vector_math, meta, matcher,
      # test_api) to versions the SDK then resolves back down. That leaves a
      # lockfile which does not describe what actually gets installed, and
      # dirties the tree on every contributor's first `flutter pub get`.
      # Fail here instead, so the lockfile is corrected before merge.
      - name: Verify pubspec.lock matches what Flutter resolves
        run: |
          if ! git diff --exit-code --stat pubspec.lock; then
            echo '::error::pubspec.lock does not match the result of flutter pub get. Run flutter pub get locally and commit the updated lockfile.'
            exit 1
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter=expanded

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The suite is the gate; a broken build shouldn't be found at release time.
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug
