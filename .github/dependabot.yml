version: 2

updates:
  # Dart / Flutter packages.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      dart-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  # The CI workflow's own actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # Android Gradle build.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
