name: Bug report
description: Something in the game behaves incorrectly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Reproduction steps are the single most useful
        thing here — a bug someone can reproduce is usually a bug that gets
        fixed.

        **Security vulnerability?** Don't file it here — see
        [SECURITY.md](https://github.com/Sthabiso10/Spella/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
      placeholder: |
        Played a 7-letter word using the whole rack, but the +25 full-rack
        bonus wasn't added to the score.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps someone else can follow.
      placeholder: |
        1. Start a Classic match
        2. Place all 7 rack tiles on the board
        3. Tap Play Word
        4. Check the scoring breakdown in the recap
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      description: Where does this happen?
      options:
        - Classic
        - Blitz
        - Marathon
        - Pass & Play
        - Daily Challenge
        - Outside a match (Home, Shop, Ranks, Friends)
        - Not mode-specific / not sure
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: "Pixel 7, Android 14 / iPhone 13, iOS 17.4"
    validations:
      required: true

  - type: input
    id: flutter-version
    attributes:
      label: Flutter version
      description: "Output of `flutter --version` — only if you built it yourself."
      placeholder: "Flutter 3.44.8, Dart 3.12.2"

  - type: textarea
    id: logs
    attributes:
      label: Logs, stack trace or screenshots
      description: Anything from the console, or a screen recording. Optional.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched [existing issues](https://github.com/Sthabiso10/Spella/issues?q=is%3Aissue) and this isn't a duplicate
          required: true
